<aside
  class="flex flex-col h-screen bg-white border-r border-zinc-200/80 text-zinc-600 shrink-0 transition-all duration-300"
  [ngClass]="isCollapsed() ? 'w-[72px]' : 'w-64'"
>
  <!-- Logo area -->
  <div
    class="flex items-center border-b border-zinc-100 h-[72px] overflow-hidden transition-all duration-300"
    [ngClass]="isCollapsed() ? 'justify-center px-0' : 'gap-3 px-6'"
  >
    <div class="flex items-center justify-center w-9 h-9 rounded-lg bg-blue-600 text-white shrink-0 shadow-lg shadow-blue-600/30">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 10V7" />
      </svg>
    </div>
    <span
      class="font-bold text-base text-zinc-900 tracking-tight whitespace-nowrap transition-all duration-300"
      [ngClass]="isCollapsed() ? 'opacity-0 w-0 overflow-hidden' : 'opacity-100'"
    >IMS Portal</span>
  </div>

  <!-- Navigation links -->
  <nav class="flex-1 py-3 space-y-0.5 overflow-y-auto overflow-x-hidden"
       [ngClass]="isCollapsed() ? 'px-2' : 'px-3'">
    @for (link of filteredLinks(); track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="!bg-blue-50 !border-blue-100 !text-blue-600 !font-semibold [&_.nav-icon]:!text-blue-600"
        class="group relative flex items-center rounded-xl border border-transparent
               hover:bg-zinc-50 hover:text-zinc-900 transition-all duration-200
               font-medium text-zinc-500 py-2.5"
        [ngClass]="isCollapsed() ? 'justify-center px-0' : 'gap-3 px-3'"
      >
        <!-- Icon — always visible -->
        <div
          [innerHTML]="link.icon | safeHtml"
          class="nav-icon w-5 h-5 shrink-0 text-zinc-400 group-hover:text-blue-600 transition-colors"
        ></div>

        <!-- Label — slides out when collapsed -->
        <span
          class="text-sm whitespace-nowrap transition-all duration-200 leading-none"
          [ngClass]="isCollapsed() ? 'opacity-0 w-0 overflow-hidden pointer-events-none' : 'opacity-100'"
        >{{ link.label }}</span>

        <!-- Tooltip in collapsed mode -->
        @if (isCollapsed()) {
          <div class="absolute left-full ml-3 px-3 py-2 bg-zinc-900 text-white text-xs font-medium rounded-lg
                      opacity-0 group-hover:opacity-100 pointer-events-none z-[100] whitespace-nowrap shadow-xl
                      transition-opacity duration-150">
            {{ link.label }}
            <!-- Arrow caret -->
            <span class="absolute right-full top-1/2 -translate-y-1/2"
                  style="border: 5px solid transparent; border-right-color: #18181b; display:block; width:0; height:0;"></span>
          </div>
        }
      </a>
    }
  </nav>

  <!-- Profile quick link -->
  <div [ngClass]="isCollapsed() ? 'px-2 pb-2' : 'px-3 pb-2'">
    <a
      routerLink="/profile"
      routerLinkActive="!bg-blue-50 !border-blue-100 !text-blue-600 !font-semibold"
      class="group relative flex items-center rounded-xl border border-transparent
             hover:bg-zinc-50 hover:text-zinc-900 transition-all duration-200
             font-medium text-zinc-500 py-2.5"
      [ngClass]="isCollapsed() ? 'justify-center px-0' : 'gap-3 px-3'"
    >
      <div class="w-5 h-5 shrink-0 text-zinc-400 group-hover:text-blue-600 transition-colors">
        <svg class="w-full h-full" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <span
        class="text-sm whitespace-nowrap transition-all duration-200"
        [ngClass]="isCollapsed() ? 'opacity-0 w-0 overflow-hidden pointer-events-none' : 'opacity-100'"
      >My Profile</span>
      @if (isCollapsed()) {
        <div class="absolute left-full ml-3 px-3 py-2 bg-zinc-900 text-white text-xs font-medium rounded-lg
                    opacity-0 group-hover:opacity-100 pointer-events-none z-[100] whitespace-nowrap shadow-xl
                    transition-opacity duration-150">
          My Profile
          <span class="absolute right-full top-1/2 -translate-y-1/2"
                style="border: 5px solid transparent; border-right-color: #18181b; display:block; width:0; height:0;"></span>
        </div>
      }
    </a>
  </div>

  <!-- Collapse Toggle Button -->
  <div class="p-3 border-t border-zinc-100">
    <button
      (click)="toggleCollapse()"
      class="group relative flex items-center w-full rounded-xl bg-zinc-50 hover:bg-zinc-100
             hover:text-zinc-900 transition-all duration-200 text-zinc-400 py-2.5"
      [ngClass]="isCollapsed() ? 'justify-center px-0' : 'gap-3 px-3'"
    >
      <!-- Chevron -->
      <svg
        class="w-5 h-5 shrink-0 transition-transform duration-300"
        [ngClass]="isCollapsed() ? 'rotate-180' : 'rotate-0'"
        fill="none" viewBox="0 0 24 24" stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
      </svg>
      <span
        class="text-sm font-medium whitespace-nowrap transition-all duration-200"
        [ngClass]="isCollapsed() ? 'opacity-0 w-0 overflow-hidden pointer-events-none' : 'opacity-100'"
      >Collapse</span>
      @if (isCollapsed()) {
        <div class="absolute left-full ml-3 px-3 py-2 bg-zinc-900 text-white text-xs font-medium rounded-lg
                    opacity-0 group-hover:opacity-100 pointer-events-none z-[100] whitespace-nowrap shadow-xl
                    transition-opacity duration-150">
          Expand sidebar
          <span class="absolute right-full top-1/2 -translate-y-1/2"
                style="border: 5px solid transparent; border-right-color: #18181b; display:block; width:0; height:0;"></span>
        </div>
      }
    </button>
  </div>
</aside>
