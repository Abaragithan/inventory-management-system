<div class="min-h-screen bg-gradient-to-br from-zinc-50 via-blue-50/30 to-zinc-100 flex items-center justify-center p-6">
  <div class="max-w-lg w-full text-center space-y-8">
    <!-- Animated waiting icon -->
    <div class="relative inline-flex items-center justify-center">
      <!-- Outer pulse ring -->
      <div class="absolute w-32 h-32 rounded-full bg-amber-400/20 animate-ping"></div>
      <!-- Middle ring -->
      <div class="absolute w-24 h-24 rounded-full bg-amber-400/30 animate-pulse"></div>
      <!-- Icon container -->
      <div class="relative w-20 h-20 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-500 shadow-xl shadow-amber-400/30 flex items-center justify-center">
        <svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
    </div>

    <!-- Text content -->
    <div class="space-y-3">
      <h1 class="text-3xl font-bold tracking-tight text-zinc-900">Account Pending Approval</h1>
      <p class="text-zinc-500 text-base leading-relaxed">
        Your account has been created successfully, but you need to be granted access by an administrator
        before you can use the system.
      </p>
    </div>

    <!-- Info card -->
    <div class="bg-white border border-amber-200/60 rounded-2xl p-6 shadow-sm text-left space-y-4">
      <div class="flex items-start gap-3">
        <div class="w-8 h-8 rounded-lg bg-amber-50 border border-amber-200 flex items-center justify-center shrink-0">
          <svg class="w-4 h-4 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <div>
          <p class="text-sm font-semibold text-zinc-800">Logged in as</p>
          <p class="text-xs text-zinc-550 mt-0.5">{{ userEmail() }}</p>
        </div>
      </div>

      <div class="border-t border-zinc-100 pt-4 space-y-3">
        <p class="text-xs font-semibold text-zinc-600 uppercase tracking-wider">What happens next?</p>
        <div class="space-y-2">
          @for (step of steps; track step.label) {
            <div class="flex items-center gap-3">
              <div class="w-5 h-5 rounded-full border-2 border-amber-300 bg-amber-50 flex items-center justify-center shrink-0">
                <div [innerHTML]="step.icon" class="w-2.5 h-2.5 text-amber-600"></div>
              </div>
              <p class="text-xs text-zinc-600">{{ step.label }}</p>
            </div>
          }
        </div>
      </div>
    </div>

    <!-- Sign out button -->
    <button
      (click)="logout()"
      class="inline-flex items-center gap-2 px-6 py-2.5 bg-white border border-zinc-200 hover:border-zinc-300 hover:bg-zinc-50 text-zinc-700 font-semibold text-sm rounded-xl shadow-sm transition-all"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      Sign Out
    </button>
  </div>
</div>
