<div class="bg-white border border-zinc-200/80 p-8 rounded-3xl shadow-xl space-y-6">
  <div class="text-center space-y-2">
    <!-- Minimal inventory logo: stacked boxes -->
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-600 shadow-lg shadow-blue-600/30 mb-2">
      <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
          d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 10V7" />
      </svg>
    </div>
    <h1 class="text-2xl font-bold tracking-tight text-zinc-900">Welcome back</h1>
    <p class="text-xs text-zinc-550">Sign in to manage inventory and access details</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Email Field -->
    <div class="space-y-1.5">
      <label for="email" class="text-xs font-semibold text-zinc-600">Email Address</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="name@company.com"
        class="w-full px-4 py-3 bg-white border focus:ring-1 focus:ring-blue-500 rounded-xl text-sm text-zinc-900 placeholder-zinc-400 transition-all outline-none"
        [ngClass]="isFieldInvalid('email') ? 'border-rose-400 focus:border-rose-500' : 'border-zinc-200 focus:border-blue-500'"
      />
      @if (isFieldInvalid('email')) {
        <span class="text-[10px] text-rose-600 font-medium">Please enter a valid email address.</span>
      }
    </div>

    <!-- Password Field -->
    <div class="space-y-1.5">
      <label for="password" class="text-xs font-semibold text-zinc-600">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="••••••••"
        class="w-full px-4 py-3 bg-white border focus:ring-1 focus:ring-blue-500 rounded-xl text-sm text-zinc-900 placeholder-zinc-400 transition-all outline-none"
        [ngClass]="isFieldInvalid('password') ? 'border-rose-400 focus:border-rose-500' : 'border-zinc-200 focus:border-blue-500'"
      />
      @if (isFieldInvalid('password')) {
        <span class="text-[10px] text-rose-600 font-medium">Password is required.</span>
      }
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="isLoading() || loginForm.invalid"
      class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold tracking-wide shadow-lg shadow-blue-600/20 active:scale-[0.98] transition-all disabled:opacity-50 disabled:pointer-events-none flex items-center justify-center gap-2"
    >
      @if (isLoading()) {
        <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Signing In...
      } @else {
        Sign In
      }
    </button>
  </form>

  <div class="text-center">
    <p class="text-xs text-zinc-550">
      Don't have an account?
      <a routerLink="/register" class="text-blue-600 hover:text-blue-700 font-medium hover:underline">
        Register here
      </a>
    </p>
  </div>
</div>
