<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333333; margin: 0; padding: 0; background-color: #f4f4f7; }
        .container { max-width: 600px; margin: 30px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e8e8e8; }
        .header { background-color: #0f172a; padding: 30px; text-align: center; color: #ffffff; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 600; }
        .content { padding: 40px; background-color: #ffffff; }
        .status-badge { display: inline-block; padding: 6px 16px; background-color: {StatusColor}; color: #ffffff; border-radius: 30px; font-weight: bold; font-size: 14px; text-transform: uppercase; margin-bottom: 20px; }
        .footer { background-color: #f8fafc; padding: 25px; text-align: center; font-size: 13px; color: #64748b; border-top: 1px solid #f1f5f9; }
    </style>
</head>
<body>
    <div class='container'>
        <div class='header'>
            <h1>Inventory Management System</h1>
        </div>
        <div class='content'>
            <h2>Purchase Request Status Update</h2>
            <p>Your Purchase Request <span style='font-weight: bold;'>{RequestNumber}</span> has been updated:</p>
            <div class='status-badge'>{Status}</div>
            {NoteSection}
            <p>You can view the full history and details by logging into the application dashboard.</p>
        </div>
        <div class='footer'>
            <p>&copy; {Year} Inventory Management System. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
