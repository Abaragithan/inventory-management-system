<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333333; margin: 0; padding: 0; background-color: #f4f4f7; }
        .container { max-width: 600px; margin: 30px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e8e8e8; }
        .header { background-color: #10b981; padding: 30px; text-align: center; color: #ffffff; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 600; }
        .content { padding: 40px; background-color: #ffffff; }
        .highlight { color: #10b981; font-weight: bold; }
        .btn-container { text-align: center; margin: 35px 0; }
        .btn { display: inline-block; padding: 14px 28px; background-color: #10b981; color: #ffffff !important; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; transition: background-color 0.2s; }
        .btn:hover { background-color: #059669; }
        .footer { background-color: #f8fafc; padding: 25px; text-align: center; font-size: 13px; color: #64748b; border-top: 1px solid #f1f5f9; }
    </style>
</head>
<body>
    <div class='container'>
        <div class='header'>
            <h1>Welcome to IMS</h1>
        </div>
        <div class='content'>
            <h2>Your Account is Activated!</h2>
            <p>Hello,</p>
            <p>An administrator has activated your account. You can now access the system using your registered role: <span class='highlight'>{Role}</span>.</p>
            <div class='btn-container'>
                <a href='http://localhost:4200/login' class='btn' target='_blank'>Login to Your Account</a>
            </div>
            <p>We're glad to have you on board!</p>
        </div>
        <div class='footer'>
            <p>&copy; {Year} Inventory Management System. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
